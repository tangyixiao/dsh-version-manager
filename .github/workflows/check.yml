name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin ships plain JavaScript and has no dependencies, so there is
      # nothing to install: the suite runs on the Node standard library alone.
      - run: node --test --test-concurrency=1 test/
      - name: Pack the plugin and inspect what npm would publish
        run: npm pack --dry-run

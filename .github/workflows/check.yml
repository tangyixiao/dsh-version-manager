name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The plugin ships plain JavaScript and has no dependencies, so there is
      # nothing to install: the suite runs on the Node standard library alone.
      # Node 22 does not accept a directory argument here, it resolves "test/"
      # as a module and fails with MODULE_NOT_FOUND, so discovery is left to the
      # runner: with no path it searches the project for test files.
      - run: node --test --test-concurrency=1
      - name: Pack the plugin and inspect what npm would publish
        run: npm pack --dry-run
